<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator plaće</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #rezultat {
            margin-top: 25px;
            padding: 18px;
            background: #f0f7ff;
            border-radius: 10px;
            display: none;
            line-height: 1.8;
        }

        .napomena {
            font-size: 13px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Kalkulator plaće</h1>

    <p>
        Unesite bruto plaću i procijenite koliko bi vam moglo
        ostati nakon osnovnih odbitaka.
    </p>

    <label for="bruto">Bruto plaća (€)</label>
    <input type="number" id="bruto" placeholder="npr. 2000">

    <label for="postotak">Procijenjeni odbici (%)</label>
    <input type="number" id="postotak" value="25" step="0.1">

    <button onclick="izracunajPlacu()">Izračunaj</button>

    <div id="rezultat"></div>

    <div class="napomena">
        Ovo je informativni kalkulator. Stvarni neto iznos
        ovisi o porezima, doprinosima, olakšicama i drugim faktorima.
    </div>

</div>

<script>
function izracunajPlacu() {

    const bruto = parseFloat(document.getElementById("bruto").value);
    const postotak = parseFloat(document.getElementById("postotak").value);

    if (!bruto || bruto <= 0 || postotak < 0 || postotak >= 100) {
        alert("Molimo unesite ispravne podatke.");
        return;
    }

    const odbici = bruto * (postotak / 100);
    const neto = bruto - odbici;

    const rezultat = document.getElementById("rezultat");

    rezultat.style.display = "block";

    rezultat.innerHTML = `
        <strong>Procjena:</strong><br><br>
        💼 Bruto plaća: <strong>${bruto.toFixed(2)} €</strong><br>
        📉 Odbici: <strong>${odbici.toFixed(2)} €</strong><br>
        💶 Procijenjeni neto: <strong>${neto.toFixed(2)} €</strong>
    `;
}
</script>

</body>
</html>
